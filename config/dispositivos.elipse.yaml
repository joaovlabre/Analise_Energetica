# Teste com o Elipse Modbus Simulator (ElipseModSim.exe) simulando um multimedidor.
# No simulador: PLCs Quantity = 1, Initial Port = 502, Protocol = Modbus TCP, REGISTERS = 32,
# Random Values DESLIGADO e valores digitados conforme config/mapas/teste_elipse_multimedidor.csv.
# Limitações do Elipse (manual v1.0.36): só TCP/IP, só holding registers (FC 03), no máximo 255
# registradores, ID sempre 1, um cliente TCP por vez. NÃO serve para simular os mapas reais dos medidores.
banco:
  url: sqlite:///dados/sge_elipse.db

api:
  host: 127.0.0.1
  porta: 8000

coleta:
  ciclo_base_s: 1.0
  reconexao_s: 5.0
  taxas:
    instantaneo: {leitura_s: 2,  gravacao_s: 60}
    energia:     {leitura_s: 60, gravacao_s: 60}
  faixas:
    tensao_:    {minimo: 0,  maximo: 600}
    corrente_:  {minimo: 0,  maximo: 5000}
    frequencia: {minimo: 55, maximo: 65}
    fp_:        {minimo: -1, maximo: 1}

agregacao:
  intervalo_min: 15
  grandezas: [energia_ativa_importada]
  max_lacuna_min: 5
  periodo_execucao_s: 60

barramentos:
  - nome: elipse
    tipo: tcp            # use rtu_over_tcp se o simulador estiver em "Protocol = Modbus RTU"
    host: 127.0.0.1
    porta_tcp: 502
    timeout_s: 1.0
    retentativas: 1
    pausa_entre_pedidos_ms: 0

dispositivos:
  - nome: ELIPSE_MM1
    modelo: Multimedidor simulado (Elipse)
    barramento: elipse
    endereco_modbus: 1
    mapa: config/mapas/teste_elipse_multimedidor.csv
    grupos: [instantaneo, energia]
    local: Teste
