# Configuração do FLUXO DE TESTES: coletor contra o simulador (python -m tests.simulador)
banco:
  url: sqlite:///dados/sge_simulador.db

hierarquia: config/hierarquia.simulador.yaml   # linhas de produção -> medidores

api:
  host: 127.0.0.1
  porta: 8000

coleta:
  ciclo_base_s: 1.0
  reconexao_s: 5.0
  taxas:                       # leitura_s = tela / valor atual; gravacao_s = histórico
    instantaneo: {leitura_s: 2,    gravacao_s: 60}
    energia:     {leitura_s: 60,   gravacao_s: 60}
    demanda:     {leitura_s: 60,   gravacao_s: 60}
    qualidade:   {leitura_s: 60,   gravacao_s: 60}
    status:      {leitura_s: 300,  gravacao_s: 300}
    config:      {leitura_s: 3600, gravacao_s: 3600}
  faixas:                      # prefixo da grandeza -> faixa física; fora dela grava 'fora_faixa'
    tensao_:            {minimo: 0,   maximo: 600}
    corrente_:          {minimo: 0,   maximo: 5000}
    frequencia:         {minimo: 55,  maximo: 65}
    fp_:                {minimo: -1,  maximo: 1}
    fp_caracteristica:  {minimo: -1,  maximo: 2}
    thd_:               {minimo: 0,   maximo: 100}
    desequilibrio_:     {minimo: 0,   maximo: 100}

agregacao:
  intervalo_min: 15
  grandezas: [energia_ativa_importada, energia_reativa_importada]
  max_lacuna_min: 5
  periodo_execucao_s: 60

barramentos:
  - nome: simulador            # simula o gateway RS485/TCP com os dois medidores atrás dele
    tipo: tcp                  # use rtu_over_tcp com --quadro rtu_over_tcp
    host: 127.0.0.1
    porta_tcp: 5020
    timeout_s: 0.5
    retentativas: 1
    pausa_entre_pedidos_ms: 0

dispositivos:
  - nome: SIM_WEG_MMW02
    modelo: WEG MMW02
    barramento: simulador
    endereco_modbus: 1
    mapa: config/mapas/weg_mmw02.csv
    local: Simulado
  - nome: SIM_SCH_EM3261
    modelo: Schneider GoLogic EM3261
    barramento: simulador
    endereco_modbus: 2
    mapa: config/mapas/schneider_gologic_em3261.csv
    local: Simulado
