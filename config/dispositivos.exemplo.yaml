# MODELO da configuração de campo. Copie para config/local/dispositivos.yaml (fora do git)
# e preencha com os dados reais: porta COM, baud rate, paridade e ID Modbus do medidor.
# Itens [A CONFIRMAR] precisam ser conferidos no display/parametrização do medidor.
banco:
  # PostgreSQL + TimescaleDB (docker compose up -d); usuário e senha no .env (modelo: .env.exemplo)
  url: postgresql+psycopg://${SGE_DB_USUARIO}:${SGE_DB_SENHA}@127.0.0.1:${SGE_DB_PORTA}/${SGE_DB_NOME}
  # url: sqlite:///dados/sge.db      # alternativa sem servidor, só para bancada

api:
  host: 0.0.0.0                        # 127.0.0.1 = só este PC; 0.0.0.0 = acessível na rede
  porta: 8000

coleta:
  ciclo_base_s: 1.0
  reconexao_s: 10.0
  taxas:
    instantaneo: {leitura_s: 2,    gravacao_s: 60}
    energia:     {leitura_s: 60,   gravacao_s: 60}
    demanda:     {leitura_s: 60,   gravacao_s: 60}
    qualidade:   {leitura_s: 60,   gravacao_s: 60}
    status:      {leitura_s: 300,  gravacao_s: 300}
    config:      {leitura_s: 3600, gravacao_s: 3600}
  faixas:
    tensao_:            {minimo: 0,   maximo: 600}     # ajustar se o medidor estiver em MT (valores de primário)
    corrente_:          {minimo: 0,   maximo: 5000}
    frequencia:         {minimo: 55,  maximo: 65}
    fp_:                {minimo: -1,  maximo: 1}
    fp_caracteristica:  {minimo: -1,  maximo: 2}
    thd_:               {minimo: 0,   maximo: 100}
    desequilibrio_:     {minimo: 0,   maximo: 100}

agregacao:
  intervalo_min: 15
  grandezas: [energia_ativa_importada, energia_reativa_importada]
  max_lacuna_min: 5
  periodo_execucao_s: 60

barramentos:
  # Arquitetura de campo: medidores em série (RS-485) -> gateway RS485/TCP -> switch -> servidor.
  # Um barramento por gateway. Baud rate, paridade e bits do lado serial são configurados
  # NO GATEWAY (e iguais em todos os medidores da rede), não aqui.
  # O coletor mantém UMA conexão TCP por gateway e faz um pedido por vez (a rede RS-485 é half-duplex).
  # Gateway escolhido: PUSR USR-DR302, modo "Modbus RTU to Modbus TCP", servidor TCP na porta 502, IP fixo.
  # Não usar o modo transparente (rtu_over_tcp) com mais de um cliente conectado.
  - nome: gateway_01
    tipo: tcp                          # USR-DR302 em modo "Modbus RTU to Modbus TCP"
                                       # use rtu_over_tcp se o gateway estiver em modo transparente (repassa o quadro RTU)
    host: 192.168.0.50                 # [A CONFIRMAR] IP fixo do USR-DR302
    porta_tcp: 502                     # [A CONFIRMAR]
    timeout_s: 1.5                     # gateway + RS-485 somam latência; ajustar após medir em campo
    retentativas: 1
    pausa_entre_pedidos_ms: 20

  # Alternativa para bancada: conversor USB-RS485 direto no PC
  # - nome: rs485_usb
  #   tipo: serial
  #   porta: COM3
  #   baudrate: 9600
  #   paridade: N
  #   timeout_s: 1.0
  #   retentativas: 2

dispositivos:
  # Um item por medidor da rede serial; o endereco_modbus é o ID do medidor na rede RS-485
  # (o gateway encaminha pelo Unit ID do Modbus TCP). Cada medidor precisa de um ID diferente.
  - nome: MED_01                       # nome do ponto de medição (ex.: QGBT_GERAL, CCM_PELETIZADORA)
    modelo: WEG MMW02
    barramento: gateway_01
    endereco_modbus: 1                 # [A CONFIRMAR]
    mapa: config/mapas/weg_mmw02.csv
    local: "[A DEFINIR]"
    ativo: true
  - nome: MED_02
    modelo: Schneider GoLogic EM3261
    barramento: gateway_01
    endereco_modbus: 2                 # [A CONFIRMAR]
    mapa: config/mapas/schneider_gologic_em3261.csv
    local: "[A DEFINIR]"
    ativo: true
